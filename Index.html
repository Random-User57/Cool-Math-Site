<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Portal</title>
    <style>
        /* ========================================================
           EASY EDIT DIRECTORY: Centralized styling colors and weights
           ======================================================== */
        :root {
            --bg-color: #000000;        /* Pure black background */
            --text-color: #ffffff;      /* White text color */
            --search-bg: #000000;       /* Black search box background */
            --search-border: #ffffff;   /* White search border */
            --font-style: sans-serif;   /* Font family */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-style);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Bold White Headings */
        h1, h3 {
            margin-bottom: 1.5rem;
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        h3 {
            font-size: 1.2rem;
            margin: 0;
        }

        /* Responsive Layout Container */
        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Bold Clean Search Bar */
        #searchBar {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid var(--search-border);
            border-radius: 8px;
            background-color: var(--search-bg);
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
        }

        /* Bold Clean File List Layout */
        #fileList {
            list-style: none;
            padding: 0;
            margin-top: 1.5rem;
        }

        .game-item {
            padding: 12px 8px;
            border-bottom: 2px solid var(--search-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .game-item a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: bold;
        }

        .game-item span {
            color: var(--text-color);
            font-weight: bold;
        }

        .no-results {
            color: var(--text-color);
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
            margin-top: 2rem;
            padding: 20px;
            border: 2px dashed var(--search-border);
            border-radius: 8px;
        }

        /* Built-in Proxy Widget Section */
        .proxy-box {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 2px dashed var(--search-border);
            width: 100%;
            text-align: center;
        }

        .proxy-wrapper {
            display: flex;
            margin-top: 1rem;
        }

        .proxy-box input {
            flex: 1;
            padding: 12px;
            border-radius: 6px 0 0 6px;
            border: 2px solid var(--search-border);
            background: var(--search-bg);
            color: var(--text-color);
            font-weight: bold;
            outline: none;
        }

        /* White Buttons with Black Bold Text */
        .proxy-box button {
            padding: 12px 24px;
            border: 2px solid var(--search-border);
            border-left: none;
            background: #ffffff;
            color: #000000;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .proxy-box button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bold, editable main heading -->
        <h1>Directory Portal</h1>

        <!-- Responsive live search bar -->
        <input type="text" id="searchBar" placeholder="Search files..." onkeyup="filterFiles()">

        <!-- Populated automatically by Eleventy compiling on load -->
        <ul id="fileList"></ul>

        <!-- Built-in Proxy Section -->
        <div class="proxy-box">
            <h3>Web Proxy</h3>
            <div class="proxy-wrapper">
                <input type="text" id="proxyUrl" placeholder="Enter URL (e.g., google.com)">
                <button onclick="launchProxy()">Launch</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================================
        // AUTOMATED ELEVENTY COLLECTION COMPILER
        // This structural array builds itself whenever CloudCannon updates.
        // ========================================================
        const customFiles = [
            {% for file in collections.all %}
                {% if file.filePathStem contains "/games/" and file.filePathStem endsWith "/index" %}
                    { 
                        name: "{{ file.filePathStem | replace('/games/', '') | replace('/index', '') | replace('-', ' ') | capitalize }}", 
                        path: ".{{ file.url }}index.html" 
                    },
                {% endif %}
            {% endfor %}
        ];

        // Unique deduplication safeguard to handle subfolder nesting configurations
        const uniqueFiles = Array.from(new Set(customFiles.map(f => f.path)))
            .map(path => customFiles.find(f => f.path === path));

        // Handles clean static rendering of text nodes
        function displayFiles(filesToRender) {
            const listContainer = document.getElementById('fileList');
            listContainer.innerHTML = '';
            
            if (filesToRender.length === 0) {
                listContainer.innerHTML = `<div class="no-results">No matching files found.</div>`;
                return;
            }

            filesToRender.forEach(file => {
                const li = document.createElement('li');
                li.className = 'game-item';
                li.innerHTML = `<a href="${file.path}">${file.name}</a> <span>➔</span>`;
                listContainer.appendChild(li);
            });
        }

        // Responsive query routing for live text matches
        function filterFiles() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = uniqueFiles.filter(file => file.name.toLowerCase().includes(query));
            displayFiles(filtered);
        }

        // Simple built-in proxy framework redirection logic
        function launchProxy() {
            let targetUrl = document.getElementById('proxyUrl').value.trim();
            if (!targetUrl) return;
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }
            const proxyGateway = "https://images" + Math.floor(Math.random() * 10) + "://googleusercontent.com" + encodeURIComponent(targetUrl);
            window.open(proxyGateway, '_blank');
        }

        // Load complete catalog array immediately
        displayFiles(uniqueFiles);
    </script>
</body>
</html>
